name: Deploy to Komodo

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [ main ]

jobs:
  deploy:
    name: Trigger Komodo Deployment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    steps:
      - name: Trigger Komodo Webhook
        env:
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL }}
        run: |
          if [ -z "$KOMODO_WEBHOOK_URL" ]; then
            echo "KOMODO_WEBHOOK_URL secret not configured yet. Skipping webhook trigger."
            echo "To enable automated deployments, add KOMODO_WEBHOOK_URL to GitHub Repository Secrets."
            exit 0
          fi
          echo "Triggering Komodo deployment webhook..."
          curl --fail-with-body --show-error --max-time 30 -X POST "$KOMODO_WEBHOOK_URL" -H "Content-Type: application/json" -d '{"event": "push", "ref": "refs/heads/main"}'
          echo "Komodo deploy trigger sent successfully!"

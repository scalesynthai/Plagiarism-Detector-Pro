[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plagiarism-detector-pro"
version = "2.1.0"
description = "Enterprise & University-Grade Academic Originality, SafeAssign Plagiarism, and AI-Content Detection Platform."
readme = "README.md"
authors = [{ name = "ScaleSynthAI", email = "scalesynthai@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "Werkzeug>=3.0.0",
    "Jinja2>=3.1.2",
    "click>=8.1.3",
    "itsdangerous>=2.2.0",
    "MarkupSafe>=2.1.1",
    "python-docx>=1.1.0",
    "pypdf>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "gunicorn>=21.2.0"
]

[project.urls]
Homepage = "https://plag.subba.dev"
Repository = "https://github.com/ScaleSynthAI/Plagiarism-Detector-Pro.git"
"Bug Tracker" = "https://github.com/ScaleSynthAI/Plagiarism-Detector-Pro/issues"
Documentation = "https://github.com/ScaleSynthAI/Plagiarism-Detector-Pro#readme"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 100
